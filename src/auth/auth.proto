syntax = "proto3";

package auth;

message AuthRequest {
  string username = 1;
  string password = 2;
  string display_name = 3;
}

message AuthUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string role = 4;
  string status = 5;
}

message AuthResponse {
  bool success = 1;
  string access_token = 2;
  string refresh_token = 3;
  string error = 4;
  AuthUser user = 5;
  string timestamp = 6;
}
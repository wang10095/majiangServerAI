services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vcat_game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d vcat_game"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migration:
    build:
      context: .
      target: migration
    env_file: .env
    environment:
      DATABASE_URL: postgresql://game:game_dev_password@postgres:5432/vcat_game?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      DATABASE_URL: postgresql://game:game_dev_password@postgres:5432/vcat_game?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: